services:
  cashper:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: "8787"
      HELIUS_API_KEY: ${HELIUS_API_KEY:-}
      SOLANA_RPC_URL: ${SOLANA_RPC_URL:-https://api.mainnet-beta.solana.com}
      SOLANA_FALLBACK_RPC_URL: ${SOLANA_FALLBACK_RPC_URL:-https://api.mainnet-beta.solana.com}
    expose:
      - "8787"
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:8787/ || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 45s

  nginx:
    build:
      context: ./docker/nginx
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      cashper:
        condition: service_healthy
    ports:
      - "${WEB_PORT:-8080}:80"
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1/nginx-health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
